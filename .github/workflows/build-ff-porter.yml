name: Build FF Porter

on:
  push:
    branches: [main, feature/pc-mod-loader-both-surfaces]
    paths:
      - "Tool/**"
      - ".github/workflows/build-ff-porter.yml"
  pull_request:
    branches: [main]
    paths:
      - "SPRX/**"
      - "Tool/**"
      - ".github/workflows/build-sprx.yml"
      - ".github/workflows/build-ff-porter.yml"
      - "CHANGELOG.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.112"

      - name: Build
        working-directory: Tool
        shell: pwsh
        run: |
          dotnet publish "src/FFPorter.Desktop.T7/FFPorter.Desktop.T7.csproj" -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "${{ github.workspace }}\dist"

      - name: Rename
        shell: pwsh
        run: Rename-Item "${{ github.workspace }}\dist\PS4 .FF Porter.exe" "PS4.FF.Porter.exe"

      - name: Check
        shell: pwsh
        run: |
          Get-Item "${{ github.workspace }}\dist\PS4.FF.Porter.exe" | Select-Object Name, Length
          Get-FileHash "${{ github.workspace }}\dist\PS4.FF.Porter.exe" -Algorithm SHA256
          (Get-FileHash "${{ github.workspace }}\dist\PS4.FF.Porter.exe" -Algorithm SHA256).Hash + "  PS4.FF.Porter.exe" | Set-Content "${{ github.workspace }}\dist\PS4.FF.Porter.exe.sha256"
          Copy-Item "${{ github.workspace }}\Tool\FORK_VERSION.txt" "${{ github.workspace }}\dist\FORK_VERSION.txt"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PS4.FF.Porter
          path: |
            dist/PS4.FF.Porter.exe
            dist/PS4.FF.Porter.exe.sha256
            dist/FORK_VERSION.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling fork release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f fork-latest "${{ github.sha }}"
          git push origin refs/tags/fork-latest --force

          $version = (Get-Content "${{ github.workspace }}\Tool\FORK_VERSION.txt" -Raw).Trim()

          gh release view fork-latest *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            gh release edit fork-latest --title "PS4 FF Porter $version" --notes "Rolling build of the FF Porter fork." --latest=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to update the fork-latest release metadata."
            }
          } else {
            gh release create fork-latest --title "PS4 FF Porter $version" --notes "Rolling build of the FF Porter fork." --latest=false
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create the fork-latest release."
            }
          }

          gh release upload fork-latest `
            "${{ github.workspace }}\dist\PS4.FF.Porter.exe" `
            "${{ github.workspace }}\dist\PS4.FF.Porter.exe.sha256" `
            "${{ github.workspace }}\dist\FORK_VERSION.txt" `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload the rolling fork release assets."
          }
