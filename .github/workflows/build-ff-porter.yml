name: Build FF Porter

on:
  push:
    branches: [main]
    paths:
      - "Tool/**"
      - ".github/workflows/build-ff-porter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.112"

      - name: Build
        working-directory: Tool
        shell: pwsh
        run: |
          dotnet publish "src/FFPorter.Cli/FFPorter.Cli.csproj" -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o "${{ github.workspace }}\dist"

      - name: Rename
        shell: pwsh
        run: Rename-Item "${{ github.workspace }}\dist\ffport.exe" "PS4.FF.Porter.exe"

      - name: Check
        shell: pwsh
        run: |
          Get-Item "${{ github.workspace }}\dist\PS4.FF.Porter.exe" | Select-Object Name, Length
          Get-FileHash "${{ github.workspace }}\dist\PS4.FF.Porter.exe" -Algorithm SHA256

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PS4.FF.Porter
          path: dist/PS4.FF.Porter.exe
          if-no-files-found: error
          retention-days: 30
