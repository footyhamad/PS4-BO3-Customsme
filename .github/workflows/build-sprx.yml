name: Build BO3 Customs SPRX (OpenOrbis)

on:
  push:
    branches: [main]
    paths:
      - "SPRX/**"
      - ".github/workflows/build-sprx.yml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make curl file binutils python3

      - name: Download OpenOrbis PS4 Toolchain v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          extract="$RUNNER_TEMP/openorbis-extract"
          mkdir -p "$extract"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            -o "$archive"
          tar -xzf "$archive" -C "$extract"
          link_file="$(find "$extract" -type f -name link.x -print -quit)"
          test -n "$link_file"
          root="$(dirname "$link_file")"
          test -d "$root/include"
          test -d "$root/lib"
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          if [[ -d "$root/bin/linux" ]]; then
            echo "$root/bin/linux" >> "$GITHUB_PATH"
          fi
          echo "OpenOrbis root: $root"
          find "$root" -maxdepth 3 -type f \( -name create-fself -o -name crtlib.o -o -name crt1.o -o -name link.x \) -print

      - name: Compile and package SPRX
        shell: bash
        run: |
          set +e
          make -C SPRX clean all 2>&1 | tee "$RUNNER_TEMP/sprx-build.log"
          result=${PIPESTATUS[0]}
          mkdir -p SPRX/build/openorbis
          cp "$RUNNER_TEMP/sprx-build.log" SPRX/build/openorbis/build.log
          if [[ $result -ne 0 ]]; then
            exit "$result"
          fi
          test -s SPRX/build/openorbis/BO3-Customs.sprx
          sha256sum SPRX/build/openorbis/BO3-Customs.sprx | tee SPRX/build/openorbis/BO3-Customs.sprx.sha256
          file SPRX/build/openorbis/BO3-Customs.sprx
          readelf -h SPRX/build/openorbis/BO3-Customs.elf
          echo "Built SPRX SHA-256:"
          sha256sum SPRX/build/openorbis/BO3-Customs.sprx

      - name: Upload build artifact and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BO3-Customs-SPRX-${{ github.sha }}
          path: |
            SPRX/build/openorbis/BO3-Customs.sprx
            SPRX/build/openorbis/BO3-Customs.sprx.sha256
            SPRX/build/openorbis/BO3-Customs.elf
            SPRX/build/openorbis/BO3-Customs.oelf
            SPRX/build/openorbis/BO3-Customs.symbols.txt
            SPRX/build/openorbis/link.x
            SPRX/build/openorbis/build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish separate SPRX rolling release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sprx-latest"
          version="$(cat SPRX/FORK_VERSION.txt | tr -d '\r\n')"
          git tag -f "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag" --force
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "PS4 BO3 Customs SPRX $version" \
              --notes "OpenOrbis build for BO3 1.33 only. Inspect the workflow build log and verify console behavior before use." --latest=false
          else
            gh release create "$tag" --title "PS4 BO3 Customs SPRX $version" \
              --notes "OpenOrbis build for BO3 1.33 only. Inspect the workflow build log and verify console behavior before use." --latest=false
          fi
          gh release upload "$tag" \
            SPRX/build/openorbis/BO3-Customs.sprx \
            SPRX/build/openorbis/BO3-Customs.sprx.sha256 \
            SPRX/build/openorbis/build.log \
            SPRX/BUILD-OPENORBIS.md \
            SPRX/FORK_VERSION.txt \
            --clobber
