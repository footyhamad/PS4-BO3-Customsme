name: Build BO3 Customs SPRX and GoldHEN PRX

on:
  push:
    branches: [main]
    paths:
      - "SPRX/**"
      - ".github/workflows/build-sprx.yml"
      - "CHANGELOG.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bo3-customs-sprx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 make curl file binutils python3 git

      - name: Download OpenOrbis PS4 Toolchain v0.5.4
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/openorbis-toolchain.tar.gz"
          extract="$RUNNER_TEMP/openorbis-extract"
          mkdir -p "$extract"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz" \
            -o "$archive"
          tar -xzf "$archive" -C "$extract"
          link_file="$(find "$extract" -type f -name link.x -print -quit)"
          test -n "$link_file"
          root="$(dirname "$link_file")"
          test -d "$root/include"
          test -d "$root/lib"
          echo "OO_PS4_TOOLCHAIN=$root" >> "$GITHUB_ENV"
          if [[ -d "$root/bin/linux" ]]; then
            echo "$root/bin/linux" >> "$GITHUB_PATH"
          fi
          echo "OpenOrbis root: $root"
          find "$root" -maxdepth 3 -type f \( -name create-fself -o -name crtlib.o -o -name crt1.o -o -name link.x \) -print

      - name: Download pinned GoldHEN Plugins SDK CRT
        shell: bash
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/GoldHEN_Plugins_SDK"
          git clone https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$sdk"
          git -C "$sdk" checkout bcea3c7ef01dac6d7f9f49ebf9e90fe66d86f5f7
          test -s "$sdk/crt/crtprx.c"
          echo "GOLDHEN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "GoldHEN SDK CRT revision: $(git -C "$sdk" rev-parse HEAD)"

      - name: Build generic OpenOrbis SPRX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SPRX/build/openorbis
          set +e
          set -o pipefail
          make -C SPRX clean all 2>&1 | tee "$RUNNER_TEMP/sprx-build.log"
          result=$?
          set -e
          cp "$RUNNER_TEMP/sprx-build.log" SPRX/build/openorbis/openorbis-build.log
          if [[ $result -ne 0 ]]; then exit "$result"; fi
          test -s SPRX/build/openorbis/BO3-Customs.sprx
          sha256sum SPRX/build/openorbis/BO3-Customs.sprx | tee SPRX/build/openorbis/BO3-Customs.sprx.sha256
          file SPRX/build/openorbis/BO3-Customs.sprx
          readelf -h SPRX/build/openorbis/BO3-Customs.elf

      - name: Build GoldHEN Plugins-compatible PRX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SPRX/build/goldhen
          set +e
          set -o pipefail
          make -C SPRX -f Makefile.goldhen clean all 2>&1 | tee "$RUNNER_TEMP/goldhen-build.log"
          result=$?
          set -e
          cp "$RUNNER_TEMP/goldhen-build.log" SPRX/build/goldhen/goldhen-build.log
          if [[ $result -ne 0 ]]; then exit "$result"; fi
          test -s SPRX/build/goldhen/BO3-Customs.prx
          sha256sum SPRX/build/goldhen/BO3-Customs.prx | tee SPRX/build/goldhen/BO3-Customs.prx.sha256
          file SPRX/build/goldhen/BO3-Customs.prx
          readelf -h SPRX/build/goldhen/BO3-Customs.elf

      - name: Upload both builds and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BO3-Customs-PS4-${{ github.sha }}
          path: |
            SPRX/build/openorbis/BO3-Customs.sprx
            SPRX/build/openorbis/BO3-Customs.sprx.sha256
            SPRX/build/openorbis/BO3-Customs.elf
            SPRX/build/openorbis/BO3-Customs.oelf
            SPRX/build/openorbis/BO3-Customs.symbols.txt
            SPRX/build/openorbis/openorbis-build.log
            SPRX/build/goldhen/BO3-Customs.prx
            SPRX/build/goldhen/BO3-Customs.prx.sha256
            SPRX/build/goldhen/BO3-Customs.elf
            SPRX/build/goldhen/BO3-Customs.oelf
            SPRX/build/goldhen/BO3-Customs.symbols.txt
            SPRX/build/goldhen/goldhen-build.log
          if-no-files-found: warn
          retention-days: 30

      - name: Publish separate SPRX and GoldHEN PRX rolling release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sprx-latest"
          version="$(cat SPRX/FORK_VERSION.txt | tr -d '\r\n')"
          git tag -f "$tag" "${{ github.sha }}"
          git push origin "refs/tags/$tag" --force
          notes="BO3 1.33 only. Use BO3-Customs.prx for the GoldHEN Plugins system; it exports plugin_load/plugin_unload and uses the official GoldHEN plugin CRT. Use BO3-Customs.sprx only with a generic loader that starts module_start. Successful CI build does not substitute for console testing."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "PS4 BO3 Customs SPRX + GoldHEN PRX $version" --notes "$notes" --latest=false
          else
            gh release create "$tag" --title "PS4 BO3 Customs SPRX + GoldHEN PRX $version" --notes "$notes" --latest=false
          fi
          gh release upload "$tag" \
            SPRX/build/openorbis/BO3-Customs.sprx \
            SPRX/build/openorbis/BO3-Customs.sprx.sha256 \
            SPRX/build/openorbis/openorbis-build.log \
            SPRX/build/goldhen/BO3-Customs.prx \
            SPRX/build/goldhen/BO3-Customs.prx.sha256 \
            SPRX/build/goldhen/goldhen-build.log \
            SPRX/BUILD-OPENORBIS.md \
            SPRX/DIAGNOSTICS.md \
            SPRX/FORK_VERSION.txt \
            --clobber
